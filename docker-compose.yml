services:
  # ----------------------------------------------------------------------------
  # FastAPI Application Backend (Dikshant / Mridul / Sahil)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dogfood-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-True}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/dogfood}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./backend:/app/backend
      - ./fixtures.json:/app/fixtures.json:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ----------------------------------------------------------------------------
  # React + Vite Frontend (Himanshu)
  # ----------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: dogfood-frontend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-${SUPABASE_URL}}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY}}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev -- --host 0.0.0.0; else echo 'Frontend package.json not found. Waiting for frontend files...' && tail -f /dev/null; fi"

  # ----------------------------------------------------------------------------
  # Local PostgreSQL (Fallback / offline development without cloud Supabase)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dogfood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dogfood}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dogfood}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
